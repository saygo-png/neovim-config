name: Update Nix Flake

on:
  schedule:
    - cron: '0 0 * * 0' # runs weekly on Sunday at 00:00
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  update-flake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update flake lockfile
        run: nix flake update

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet flake.lock; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes in flake.lock"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in flake.lock"
          fi

      - name: Build flake
        if: steps.changes.outputs.changed == 'true'
        run: nix build

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/update-flake-lock
          commit-message: "chore: update flake lockfile"
          title: "chore: update flake lockfile"
          body: Automated weekly `nix flake update`. The build passed before this PR was opened.
          add-paths: flake.lock
